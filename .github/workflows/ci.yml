name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # ruff, ruff format, docformatter, pyright and the checks of the files
      - name: Pre-commit
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests, which also check the coverage
        run: uv run pytest -q

      - name: Keep the coverage report for the badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"

      - name: Build the package
        run: uv build

      - name: The package imports without the app
        run: |
          uv venv --python 3.15 /tmp/check
          /tmp/check/bin/python -m ensurepip >/dev/null 2>&1 || true
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/python -c "import kubescope.sdk as sdk; print(sdk.API_VERSION)"

  coverage-badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Publish the badge data on the badges branch
        run: |
          percent=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"{rate * 100:.0f}" if rate in (0, 1) else f"{rate * 100:.1f}")
          PY
          )
          color=red
          if awk "BEGIN { exit !($percent >= 100) }"; then color=brightgreen
          elif awk "BEGIN { exit !($percent >= 90) }"; then color=green
          elif awk "BEGIN { exit !($percent >= 75) }"; then color=yellow
          fi
          mkdir badges && cd badges
          git init -q
          git checkout -q -b badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$percent" "$color" > coverage.json
          git add coverage.json
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "chore(badges): coverage ${percent}%"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
