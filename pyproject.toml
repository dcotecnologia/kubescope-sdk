[project]
name = "kubescope-sdk"
version = "0.1.0"
description = "The API that KubeScope and its extensions are written against"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.setuptools.packages.find]
# `kubescope` is a namespace shared with the app: there is no __init__.py in it
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib --log-level=WARN --strict-markers --tb=short"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
