[project]
name = "kubescope-sdk"
version = "1.10.0"
description = "The API that KubeScope and its extensions are written against"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "pyside6>=6.12.0,<6.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
# `kubescope` is a namespace shared with the app: there is no __init__.py in it
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=kubescope.sdk --log-level=WARN --strict-markers --tb=short --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --cov-config=pyproject.toml"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
